name: Idol Security Scan

on:
  push:
    branches: [main]
    paths:
      - "apps.json"
      - ".github/workflows/security-scan.yml"
      - "scripts/security_scan.py"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: idol-security-scan
  cancel-in-progress: false

jobs:
  scan:
    name: Scan catalog projects and release assets
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout catalog
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install scanners
        run: |
          sudo apt-get update
          sudo apt-get install -y clamav clamav-freshclam
          sudo systemctl stop clamav-freshclam.service || true
          sudo freshclam
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Install OSV-Scanner
        run: go install github.com/google/osv-scanner/v2/cmd/osv-scanner@latest

      - name: Run security scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/security_scan.py             --catalog apps.json             --output security-results.json             --max-asset-mb 500             --max-source-mb 300

      - name: Publish security report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add security-results.json
          if git diff --cached --quiet; then
            echo "Security report unchanged."
          else
            git commit -m "chore(security): update scan results"
            git push origin HEAD:main
          fi
