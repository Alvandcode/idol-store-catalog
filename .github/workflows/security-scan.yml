name: Idol Security Scan v2

on:
  push:
    branches: [main]
    paths:
      - "apps.json"
      - "scanner/**"
      - "scripts/security_scan.py"
      - ".github/workflows/security-scan.yml"
      - "security-cache/**"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: idol-security-scan
  cancel-in-progress: false

jobs:
  scan:
    name: Scan catalog sources and release assets
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Cache ClamAV signature database
        uses: actions/cache@v4
        with:
          path: /var/lib/clamav
          key: clamav-db-${{ runner.os }}
          restore-keys: clamav-db-

      - name: Install scanners
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clamav clamav-freshclam file
          sudo systemctl stop clamav-freshclam.service 2>/dev/null || true
          # Update signatures only if the cached DB is older than 12 hours.
          if [ ! -f /var/lib/clamav/daily.cvd ] || [ -z "$(find /var/lib/clamav/daily.c* -mmin -720 2>/dev/null)" ]; then
            sudo freshclam --quiet || sudo freshclam
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python scanners
        run: |
          python3 -m pip install --quiet --disable-pip-version-check "semgrep>=1.78,<2" "yara-python>=4.3,<5"

      - name: Set up Go (for OSV-Scanner / Gitleaks)
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: false

      - name: Cache Go build artifacts
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ runner.os }}-${{ hashFiles('.github/workflows/security-scan.yml') }}

      - name: Install OSV-Scanner and Gitleaks
        run: |
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.0.3
          go install github.com/zricethezav/gitleaks/v8@v8.28.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Restore result cache
        uses: actions/cache@v4
        with:
          path: security-cache
          key: idol-security-cache-${{ github.sha }}
          restore-keys: |
            idol-security-cache-

      - name: Run security scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/security_scan.py \
            --catalog apps.json \
            --output security-results.json \
            --cache-dir security-cache \
            --max-asset-mb 700 \
            --max-source-mb 300

      - name: Verify report integrity
        run: |
          python3 - <<'PY'
          import json, pathlib
          report = json.loads(pathlib.Path("security-results.json").read_text(encoding="utf-8"))
          assert report["schemaVersion"] >= 2, "schema version"
          for result in report["results"]:
              for asset in result.get("scanned_assets", []):
                  if asset.get("sha256") and asset.get("sha256_after_scan"):
                      assert asset["sha256"] == asset["sha256_after_scan"], f"integrity: {asset['name']}"
          print("Report integrity verified:", report["summary"]["by_status"])
          PY

      - name: Publish security report and cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add security-results.json security-cache
          if git diff --cached --quiet; then
            echo "Report and cache unchanged."
          else
            git commit -m "chore(security): update scan results (v2)"
            git push origin HEAD:main
          fi
