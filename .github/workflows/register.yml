name: Register user

# ربات ثبت‌نام Idol Store:
# هر Issue که با عنوان [register] باز شود، کد ثبت‌نام (IDOLREG1.…) از بدنه‌اش خوانده می‌شود.
# قوانین انحصاری:
#   ۱) هر دستگاه فقط با یک ایمیل قابل ثبت است (دستگاه ثبت‌شده با ایمیل دیگر → رد)
#   ۲) هر ایمیل فقط روی یک دستگاه معتبر است (ایمیل ثبت‌شده روی دستگاه دیگر → رد)
# در صورت موفقیت، رکورد به users.json اضافه و کامیت می‌شود و Issue بسته می‌شود.

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  register:
    if: startsWith(github.event.issue.title, '[register]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');

            async function close(msg) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: msg,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed',
              });
            }

            try {
              const body = context.payload.issue.body || '';
              const m = body.match(/IDOLREG1\.([A-Za-z0-9_\-=]+)/);
              if (!m) { await close('⛔ کد ثبت‌نام (IDOLREG1.…) در بدنه Issue پیدا نشد.'); return; }

              let payload;
              try {
                const b64 = m[1].replace(/-/g, '+').replace(/_/g, '/');
                payload = JSON.parse(Buffer.from(b64, 'base64').toString('utf8'));
              } catch (e) { await close('⛔ کد ثبت‌نام نامعتبر است.'); return; }

              const { e, d, t } = payload;
              if (!e || !d || !t || payload.v !== 1) {
                await close('⛔ کد ثبت‌نام ناقص است (فیلدهای e/d/t/v).'); return;
              }

              const path = 'users.json';
              let users = [];
              try { users = JSON.parse(require('fs').readFileSync(path, 'utf8')); } catch (_) {}

              if (users.some(u => u.d === d && u.e !== e)) {
                await close('⛔ ثبت‌نام رد شد: این دستگاه قبلاً با ایمیل دیگری ثبت شده است.\nهر دستگاه فقط با یک ایمیل قابل ثبت است.'); return;
              }
              if (users.some(u => u.e === e && u.d !== d)) {
                await close('⛔ ثبت‌نام رد شد: این ایمیل قبلاً روی دستگاه دیگری ثبت شده است.\nهر ایمیل فقط روی یک دستگاه معتبر است.'); return;
              }
              if (users.some(u => u.e === e && u.d === d && u.t === t)) {
                await close('ℹ️ این دستگاه قبلاً با همین ایمیل ثبت شده است؛ نیازی به ثبت‌نام دوباره نیست.'); return;
              }

              users.push({ e, d, t, at: new Date().toISOString() });
              require('fs').writeFileSync(path, JSON.stringify(users, null, 2) + '\n');

              execSync('git config user.name "idol-register-bot"');
              execSync('git config user.email "actions@users.noreply.github.com"');
              execSync('git add users.json');
              execSync(`git commit -m "register user ${String(e).slice(0, 10)}…"`);
              execSync('git push');

              await close('✅ ثبت‌نام انجام شد! حالا در اپ با همان ایمیل و توکن وارد شوید.');
            } catch (err) {
              await close('⛔ خطا در پردازش ثبت‌نام: ' + (err && err.message ? err.message : String(err)));
            }
